{% extends "base.html" %}

{% block title %}Run Scan — Scanlyne{% endblock %}

{% block content %}
<h1>Run Scan</h1>

<div class="form-card">
    <div class="form-card-header">
        <span class="ready-dot"></span>
        <h2>New Target</h2>
    </div>

    <form id="scan-form" action="{{ url_for('scan.start_scan') }}" method="POST">
        <div class="form-group">
            <label for="target">Target</label>
            <input
                type="text"
                id="target"
                name="target"
                placeholder="192.168.1.0/24 or scanme.nmap.org"
                required
                autocomplete="off"
                spellcheck="false"
            >
            <small>IP address, CIDR range, or hostname</small>
        </div>

        <div class="form-group">
            <label for="flags">Flags</label>
            <input
                type="text"
                id="flags"
                name="flags"
                placeholder="-sV -T4"
                autocomplete="off"
                spellcheck="false"
            >
            <small>Optional nmap flags — e.g. -sS, -sV, -O, -A, -T4, -p 1-1000</small>
        </div>

        <button type="submit" class="btn btn-primary">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                <path d="M2 2.5l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="7" y1="10.5" x2="11.5" y2="10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Start Scan
        </button>
    </form>
</div>
{% endblock %}
